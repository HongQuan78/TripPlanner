# 2026-07-14: added 5-11-trip-destination-detail-link — user reported that on
# /trips/:id they cannot click a trip destination to see its detail view.
# Root-caused to GET /api/trips/{id} never exposing each destination's OpenTripMap
# external id (Destination.ExternalId exists on the domain entity but was never
# mapped onto DestinationResponse), so the frontend had no xid to link to the
# existing /attractions/:xid details page (story 5-4). Full-stack story: expose
# Xid on DestinationResponse + map it, then link trip-day destination rows to
# their details page (with a plain-text fallback when xid is absent).

