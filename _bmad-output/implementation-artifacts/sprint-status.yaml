# 2026-07-22: 1-5-attraction-list-pagination picked up for dev-story
# implementation. Task 0 provider check: the OpenTripMap docs site is parked/
# JS-rendered and the swagger requires an API key, so live confirmation of a
# /radius `offset` parameter could not be obtained. Per the story's Task 0
# contingency, chose Approach B (expand-and-slice): request /radius with an
# expanded limit (offset+pageSize) and slice the page window client-of-provider,
# enriching ONLY the requested page's xids. Robust regardless of provider offset
# support (relies only on the proven `limit` param) and keeps page-1 behavior
# byte-for-byte identical (offset=0 → limit unchanged).

