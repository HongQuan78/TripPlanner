# 2026-07-25: added 10-2-redis-connection-string-in-env — user wants the Redis
# connection string supplied through the environment. 10-1 shipped it hard-coded at
# docker-compose.yml:41 ("redis:6379") while every sibling setting on that same
# environment: block is a ${...} substitution; .env.production.example describes Redis
# in a comment but declares no variable; BE/.env.example omits Redis entirely. Scope:
# compose becomes ${ConnectionStrings__Redis:-redis:6379} (the `:-` form matters — a
# bare substitution would silently degrade every default `up` to a per-process cache),
# both env examples gain documented variables, CLAUDE.md gains the Redis wiring 10-1
# never added, and the newly-reachable empty-string config is pinned by tests. 10-1's
# six open review patches deliberately excluded. Created + picked up for dev-story.

# 2026-07-25: 10-2-redis-connection-string-in-env implemented — all 5 tasks done.
# ZERO production C# changed: 10-1 already read the value via GetConnectionString("Redis"),
# so only the supply of the value was hard-coded. docker-compose.yml now uses
# "${ConnectionStrings__Redis:-redis:6379}" (quoted — a deviation from the story's own
