# 2026-07-14: 8-3-fix-missing-destination-images implemented — all 6 tasks done.
# User-Agent set on the Wikipedia client (the 403 root cause), provider now
# queries the language wiki named in the URL and escapes titles, Wikidata P18 →
# Commons Special:FilePath fallback added, OpenTripMap /xid fan-out bounded to
# 5 concurrent with 429 retry. 166/166 BE tests green (+17 new); e2e verified:
# Hanoi went 0/20 → 14/20 attractions with images, details verified for
# en-wiki, vi-wiki-only, and Wikidata-fallback places. Moved to review.

# 2026-07-14: added 8-3-fix-missing-destination-images — user reported zero
# destination images in search and details despite 8-2. Root-caused to three
# stacked failures: (1) FATAL — Wikimedia now 403s any request without a
# User-Agent header and ConfigureWikipediaClient never sets one (Photon's
# does), so 100% of image lookups silently fail; (2) non-English wikipedia
# URLs (e.g. vi.wikipedia.org, ~half of Hanoi results) 404 against the
# hard-coded en base (deferred 8-2 review finding); (3) places without a
# usable Wikipedia thumbnail get nothing — fixed via a Wikidata P18 → Commons
# Special:FilePath fallback (OpenTripMap supplies wikidata ids). Picked up
# immediately for dev-story implementation.

# 2026-07-14: added 8-2-wikipedia-primary-image-provider — user confirmed
