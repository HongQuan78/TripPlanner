# the story file, same convention as epic-6/epic-7) and its first story,
# 8-1-destination-image-wikipedia-fallback — adds a free Wikipedia-thumbnail
# fallback (via IWikipediaImageService) for destination images when OpenTripMap's
# dev-tier API has no preview/image, so real photos show up more often before the
# existing FE placeholder path kicks in.

# 2026-07-13: added 5-8-trips-nav-and-auth-race-fix — adds a "My Trips" header nav
# link and fixes a cold-load race where AuthProvider's token-provider wiring
# (registered in a useEffect) loses to a child route's mount-time TanStack Query
# fetch, causing a headerless first request, a spurious 401, and a valid session
# being wiped and bounced to /login when typing /trips directly into the URL bar.

