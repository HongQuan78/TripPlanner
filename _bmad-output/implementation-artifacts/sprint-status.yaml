# 2026-07-13: added 5-9-destination-autosuggest-prefix-match — user reported "Ho"
# doesn't list all matching destinations; root-caused to OpenTripMap's /geoname
# geocoder being a single-best-match API, not multi-result autosuggest. Story
# replaces IGeocodingService's OpenTripMap-backed implementation with a free,
# keyless multi-result provider (e.g. Photon/OSM) behind the same seam — no
# frontend changes needed, FE already renders arrays of up to 5 suggestions.

# 2026-07-13: 8-1-destination-image-wikipedia-fallback picked up for dev-story implementation.

