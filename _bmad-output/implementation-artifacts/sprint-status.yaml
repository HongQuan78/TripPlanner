# 2026-07-19: 3-6-move-destination-between-days code-reviewed — found + fixed the
# reported "Destination already exists in this day." bug on cross-day drag. Root
# cause: destinations are deduped globally by ExternalId (DestinationResolver
# reuses the row), so the same place can sit in two days; a move onto a day that
# already held it hit AC #2's 400 while the FE optimistic hook already deduped the
# append — so the removal rolled back and the error flashed. Fix: made the move
# idempotent — Trip.MoveDestinationBetweenDays appends to target only if absent,
# use case drops the BadRequest guard (target-already-present now removes from
# source + succeeds, matching the FE). Deliberate AC #2 deviation. BE 224 (+1),
# FE 263 (+1), lint clean, build green. Still in review pending live drag QA.

