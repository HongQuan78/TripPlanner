# Wikipedia *fallback* becomes the *sole* image source: both OpenTripMap
# services stop reading preview/image entirely and route through a new
# provider-agnostic IDestinationImageProvider seam (replacing
# IWikipediaImageService), so a different image approach later is one new
# implementation + one DI swap, mirroring the 7-2 IEmailSender convention.

