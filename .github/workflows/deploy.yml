name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy
        required: false
        default: ''

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_IMAGE_NAME: tripplanner-api
  WEB_IMAGE_NAME: tripplanner-web

jobs:
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner: ${{ steps.meta.outputs.owner }}
      sha: ${{ steps.meta.outputs.sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./BE
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.API_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.API_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./FE
          push: true
          build-args: |
            VITE_API_BASE_URL=
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ env.WEB_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Write SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy over SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          GHCR_OWNER: ${{ needs.build-push.outputs.owner }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image_tag }}
          DEPLOY_SHA: ${{ needs.build-push.outputs.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            "GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' DEPLOY_SHA='$DEPLOY_SHA' \
             GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' APP_DIR='${APP_DIR:-~/TripPlanner}' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "${APP_DIR/#\~/$HOME}"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          git fetch --tags origin
          git reset --hard "$DEPLOY_SHA"

          API_IMAGE="ghcr.io/$GHCR_OWNER/tripplanner-api:$IMAGE_TAG"
          WEB_IMAGE="ghcr.io/$GHCR_OWNER/tripplanner-web:$IMAGE_TAG"
          docker pull "$API_IMAGE"
          docker pull "$WEB_IMAGE"

          export GHCR_OWNER IMAGE_TAG
          COMPOSE="docker compose -f docker-compose.yml -f docker-compose.deploy.yml"

          $COMPOSE up -d --no-build --remove-orphans

          echo "Waiting for services to report healthy..."
          for i in $(seq 1 30); do
            unhealthy=0
            for svc in db redis api web; do
              cid=$($COMPOSE ps -q "$svc")
              if [ -z "$cid" ]; then unhealthy=1; continue; fi
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$cid")
              if [ "$status" != "healthy" ]; then unhealthy=1; fi
            done
            if [ "$unhealthy" -eq 0 ]; then echo "All services healthy."; break; fi
            if [ "$i" -eq 30 ]; then
              echo "Services did not become healthy in time." >&2
              $COMPOSE ps
              $COMPOSE logs --tail 80 api
              exit 1
            fi
            sleep 10
          done

          $COMPOSE ps
          docker logout ghcr.io
          docker image prune -f
          REMOTE

      - name: Smoke test the public endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          code=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "http://$EC2_HOST/")
          echo "GET http://$EC2_HOST/ -> $code"
          test "$code" = "200"
